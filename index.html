<!DOCTYPE html>
<html ng-app="myApp">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width">
    <meta name="viewport" content="initial-scale=1">
    <title>Descent</title>
    <link href="Content/bootstrap.css" rel="stylesheet" />
    <link href="Content/ui-bootstrap-csp.css" rel="stylesheet" />
    <link href="Content/font-awesome.css" rel="stylesheet" />
    <link href="Content/cards.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/6.11.4/sweetalert2.min.css" />
    <script src="Scripts/angular.js" defer></script>
    <script src="Scripts/angular-animate.js" defer></script>
    <script src="Scripts/angular-route.js" defer></script>
    <script src="Scripts/angular-sanitize.js" defer></script>
    <script src="Scripts/angular-ui/ui-bootstrap-tpls.js" defer></script>
    <script src="Scripts/angular-ui/uploader.js" defer></script>
    <script src="appScripts/cardService.js" defer></script>
    <script src="appScripts/cardText.js" defer></script>
    <script src="appScripts/cardDirective.js" defer></script>
    <script src="appScripts/heroService.js" defer></script>
    <script src="appScripts/main.js" defer></script>
    <script src="appScripts/saveService.js" defer></script>
    <script src="appScripts/navctrl.js" defer></script>
    <script src="appScripts/mainctrl.js" defer></script>
    <script src="appScripts/charctrl.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/6.11.4/sweetalert2.min.js"></script>
</head>
<body>
    <div ng-controller="NavCtrl">
        <nav class="navbar navbar-default" role="navigation">
            <div class="navbar-header">
                <!--<button type="button" class="navbar-toggle" ng-click="isNavCollapsed = !isNavCollapsed">
                    <span class="sr-only">Toggle navigation</span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>-->
                <a href="#" class="navbar-brand"><i class="fa fa-home" style="font-size:xx-large;"></i></a>
                <ul class="navbar-nav hidden-sm hidden-md hidden-lg" style="list-style: none;">
                    <li ng-repeat="item in appData.characters">
                        <a href="#!char/{{$index + 1}}">
                            <img class="img-rounded pull-left" height="36" style="padding-right: 10px; padding-left: 10px;" ng-class="{'tapped': item.isCharTapped}" ng-src="{{heroes.face(item)}}" alt="{{item.name}}" />
                        </a>
                    </li>
                    <li ng-if="appData.characters.length > 0">
                        <a>
                            <img class="img-rounded pull-left" ng-click="unTapAll()" height="36" style="cursor: pointer;padding-right: 10px; padding-left: 10px;" src="Images/tap.png" />
                        </a>
                    </li>
                </ul>
            </div>
            <div class="collapse navbar-collapse hidden-xs" uib-collapse="isNavCollapsed">
                <ul class="nav navbar-nav">
                    <li ng-repeat="item in appData.characters">
                        <a href="#!char/{{$index + 1}}">
                            <img class="img-rounded pull-left" height="48" style="padding-right: 3px;" ng-class="{'tapped': item.isCharTapped}" ng-src="{{heroes.face(item)}}" alt="{{item.name}}" />
                            <uib-progressbar style="width: 200px; margin:1px 1px 2px 0px;" type="danger" value="item.wounds" max="item.woundsCap"></uib-progressbar>
                            <uib-progressbar style="width: 200px; margin:1px 1px 2px 0px;" type="warning" value="item.fatigue" max="item.fatigueCap"></uib-progressbar>
                        </a>
                    </li>
                    <li ng-if="appData.characters.length > 0">
                        <a>
                            <img class="img-rounded" ng-click="unTapAll()" height="48" style="cursor: pointer;padding-right: 3px;" src="Images/tap.png" />
                        </a>
                    </li>
                    <li  ng-if="appData.characters.length > 0">
                        <a href="" class="">
                            <i class="fa fa-save" style="font-size:45px;" ng-click="exportToFile();"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
    <div ng-view>    </div>

    <style>
        .tapped {
            filter: grayscale(100%);
        }
    </style>
</body>
</html>
